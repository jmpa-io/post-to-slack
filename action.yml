name: post-to-slack
description: |
  A GitHub Action for sending notifications from running jobs to Slack (via a given webhook, or as a bot).
author: jmpa-io
runs:
  using: docker
  image: Dockerfile
inputs:
  webhook:
    description: |
      The Slack webhook to post to; This is created / managed
      by a custom Slack App in your workspace.
      Optional if token and channel are given instead.
    required: false
  token:
    description: |
      A Slack bot token (xoxb-...) with the chat:write scope; Used with
      channel when no webhook is given.
    required: false
  channel:
    description: |
      The id of the Slack channel to post to (eg. C0123456789); Used with
      token. The bot must be a member of the channel, or have chat:write.public.
    required: false
  status:
    description: |
      The status of the running GitHub Action job.
    required: true
